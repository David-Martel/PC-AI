name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ──────────────────────────────────────────────────────────────
  # Fast checks (parallel, ~1 min each)
  # ──────────────────────────────────────────────────────────────

  security-scan:
    name: Security Scan
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Was a second, divergent copy of the credential patterns inlined here.
      # It matched on the PATTERN alone, with no check on the matched VALUE, so
      # it fired on `api_key = "<20+ chars>"` regardless of what those chars
      # were -- including the positive-control canaries inside
      # Tools/Test-CredentialScan.ps1 itself, which is what failed run
      # 34152812699. A scanner that cannot tell a canary from a secret cries
      # wolf, and a security gate that cries wolf gets muted.
      #
      # Both workflows now call the one rule-based scanner, which guards on the
      # matched value (length, entropy, placeholder/test wordlist) and runs 5
      # positive and 6 negative controls on every invocation, so it fails loudly
      # if it ever stops being able to detect a real secret.
      - name: Check for Hardcoded Credentials
        shell: pwsh
        run: |
          .\Tools\Test-CredentialScan.ps1
          exit $LASTEXITCODE

      - name: Validate Module Manifests
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem -Path Modules -Recurse -Filter *.psd1 | ForEach-Object {
              try {
                  $null = Test-ModuleManifest $_.FullName -ErrorAction Stop
                  Write-Host "  $($_.Name) - Valid" -ForegroundColor Green
              } catch {
                  $errors += "$($_.Name): $_"
              }
          }
          if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }

      - name: Check for Dangerous Commands
        shell: pwsh
        run: |
          $cmds = @('Invoke-Expression', 'iex ', 'Start-Process.*-Verb RunAs',
                     'Remove-Item.*-Recurse.*-Force', 'Format-Volume', 'Clear-Disk', 'Remove-Partition')
          $findings = @()
          Get-ChildItem -Recurse -Include *.ps1,*.psm1 | ForEach-Object {
              $lines = Get-Content $_.FullName
              foreach ($cmd in $cmds) {
                  $matchingLines = $lines | Where-Object { $_ -match $cmd -and $_ -notmatch '^\s*#' }
                  if ($matchingLines) {
                      $findings += "$($_.FullName): $cmd"
                  }
              }
          }
          if ($findings) {
              Write-Host "Potentially dangerous commands (review required):" -ForegroundColor Yellow
              $findings | ForEach-Object { Write-Host "  $_" -ForegroundColor Yellow }
          }

  rust-fmt:
    name: Rust Format
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check Format
        shell: pwsh
        run: |
          .\Build.ps1 -Component format -LintProfile rust-inference-fmt -DependencyStrategy locked
          if ($LASTEXITCODE -ne 0) { throw "Format check failed" }

  powershell-lint:
    name: PowerShell Lint
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
      # PSScriptAnalyzer never sees PowerShell that lives inside a workflow's
      # `run:` block, which is how a Credential Scan with a broken regex string
      # and an unparseable release-cuda.yml both reached main and stayed there.
      - name: Validate Workflow Syntax
        shell: pwsh
        run: |
          Install-Module powershell-yaml -Force -Scope CurrentUser
          .\Tools\Test-WorkflowSyntax.ps1
          if ($LASTEXITCODE -ne 0) { throw "Workflow syntax validation failed" }
      - name: Run Lint
        shell: pwsh
        run: |
          .\Build.ps1 -Component lint -LintProfile powershell
          if ($LASTEXITCODE -ne 0) { throw "PowerShell lint failed" }

  # ──────────────────────────────────────────────────────────────
  # Medium checks (~3-5 min each)
  # ──────────────────────────────────────────────────────────────

  rust-check:
    name: Rust Check + Clippy
    runs-on: windows-latest
    timeout-minutes: 30
    needs: rust-fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Native/pcai_core
          shared-key: pcai-inference
      - name: Cargo Check
        shell: pwsh
        run: |
          .\Build.ps1 -Component lint -LintProfile rust-inference-check -DependencyStrategy locked
          if ($LASTEXITCODE -ne 0) { throw "Cargo check failed" }
      - name: Clippy
        shell: pwsh
        run: |
          .\Build.ps1 -Component lint -LintProfile rust-inference-clippy -DependencyStrategy locked
          if ($LASTEXITCODE -ne 0) { throw "Clippy failed" }

  rust-test:
    name: Rust Tests
    runs-on: windows-latest
    timeout-minutes: 30
    needs: rust-check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Native/pcai_core
          shared-key: pcai-inference-test
      - name: Run Unit Tests
        working-directory: Native/pcai_core/pcai_inference
        run: cargo test --no-default-features --features server,ffi --lib
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Coverage Report
        working-directory: Native/pcai_core/pcai_inference
        run: |
          cargo llvm-cov --no-default-features --features server,ffi --lib --lcov --output-path lcov.info
          cargo llvm-cov --no-default-features --features server,ffi --lib --fail-under-lines 70
      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          files: Native/pcai_core/pcai_inference/lcov.info
          flags: rust-inference
          fail_ci_if_error: false
      - name: Upload LCOV Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-lcov-${{ github.sha }}
          path: Native/pcai_core/pcai_inference/lcov.info
          retention-days: 30

  powershell-test:
    name: PowerShell Tests
    runs-on: windows-latest
    timeout-minutes: 60
    needs: powershell-lint
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -MinimumVersion 5.6.1 -MaximumVersion 5.99.99 -Force -Scope CurrentUser
      - name: Run Tests with Coverage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path Tests/TestResults -Force | Out-Null
          $config = New-PesterConfiguration
          if (Test-Path "Tests/PesterConfiguration.psd1") {
              $config = New-PesterConfiguration -Hashtable (Import-PowerShellDataFile Tests/PesterConfiguration.psd1)
          }
          # This job has no download-artifact step, no Rust toolchain and no
          # rust-cache, so it can neither find the native DLLs that
          # Tests/Integration needs nor build them cheaply. Running them here
          # cost ~50 min of uncached cargo compile (via
          # RustBuild.Integration.Tests.ps1) and pushed the job past its own
          # 60-minute timeout. Tests/Unit alone: 708 passed / 9 failed in 6.2 min.
          #
          # Set here rather than in Tests/PesterConfiguration.psd1, which is
          # shared with Tests/.pester.ps1 and maintenance.yml -- narrowing the
          # config would silently narrow the local full-suite run too. The
          # limitation belongs to this job, so it lives in this job.
          #
          # Tests/Integration belongs in integration-tests, which does download
          # the artifacts; moving it there is a follow-up, as those 22 suites
          # have never executed against a real DLL and will surface real gaps.
          $config.Run.Path = @('Tests/Unit')
          $config.Run.Exit = $true
          $config.CodeCoverage.Enabled = $true
          $config.CodeCoverage.OutputFormat = 'JaCoCo'
          $config.CodeCoverage.OutputPath = 'Tests/TestResults/coverage.xml'
          $config.CodeCoverage.CoveragePercentTarget = 85
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config
      - name: Upload Coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./Tests/TestResults/coverage.xml
          flags: powershell
          fail_ci_if_error: false

  # ──────────────────────────────────────────────────────────────
  # Build + Integration (~5-8 min)
  # ──────────────────────────────────────────────────────────────

  build-llamacpp:
    name: Build (llamacpp CPU)
    runs-on: windows-latest
    timeout-minutes: 45
    needs: rust-test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - run: choco install ninja -y
      - uses: Swatinem/rust-cache@v2
        with:
          # The WORKSPACE root, not the crate directory. pcai_inference is a member
          # of the Native/pcai_core workspace, so that is where Cargo.lock and
          # target/ live; pointing this at the crate meant caching against a path
          # that has neither.
          workspaces: Native/pcai_core
          shared-key: pcai-inference-msvc
      - name: Set MSVC Environment
        shell: pwsh
        run: |
          $clPath = (Get-Command cl.exe).Source
          echo "CC=$clPath" >> $env:GITHUB_ENV
          echo "CXX=$clPath" >> $env:GITHUB_ENV
          echo "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV
      - name: Build + Test
        shell: pwsh
        run: |
          .\Build.ps1 -Component llamacpp -Configuration Release -RunTests
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }
      - name: Copy Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path bin -Force | Out-Null

          # Ask cargo where it put things rather than guessing. The old list named
          # Native\pcai_core\pcai_inference\target\release, which cannot exist:
          # pcai_inference is a workspace member, so cargo writes to the workspace
          # target dir, not the member's own.
          $targetRoot = $null
          try {
              $meta = cargo metadata --no-deps --format-version 1 --manifest-path Native/pcai_core/Cargo.toml 2>$null
              if ($LASTEXITCODE -eq 0 -and $meta) { $targetRoot = ($meta | ConvertFrom-Json).target_directory }
          } catch { }
          if (-not $targetRoot) { $targetRoot = "Native\pcai_core\target" }

          # Accept either name. The crate's lib is `pcai_inference_lib`, so cargo
          # emits pcai_inference_lib.dll; the tests and this workflow both want
          # bin\pcai_inference.dll, so normalise on copy rather than depending on
          # the internal crate name staying put.
          $names = @("pcai_inference.dll", "pcai_inference_lib.dll")
          $dirs  = @(".pcai\build\artifacts\pcai-llamacpp", (Join-Path $targetRoot "release"))
          $paths = foreach ($d in $dirs) { foreach ($n in $names) { Join-Path $d $n } }

          $copied = $false
          foreach ($p in $paths) {
              if (Test-Path $p) {
                  Copy-Item $p -Destination "bin\pcai_inference.dll" -Force
                  Write-Host "Copied $p -> bin\pcai_inference.dll"
                  $copied = $true
                  break
              }
          }
          # Fail loudly. Previously this silently copied nothing, the upload step
          # only warned, and Integration Tests then failed downloading an artifact
          # that was never produced -- three steps away from the actual cause.
          if (-not $copied) {
              Write-Host "::error::pcai_inference.dll not found. Searched:"
              $paths | ForEach-Object { Write-Host "::error::  $_" }
              exit 1
          }
      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: pcai-inference-dll-${{ github.sha }}
          path: bin/pcai_inference.dll
          # error, not warn: Integration Tests downloads this artifact, so an
          # empty upload turns a missing DLL into a confusing failure one job
          # later instead of here.
          if-no-files-found: error

  integration-tests:
    name: Integration Tests
    runs-on: windows-latest
    timeout-minutes: 30
    needs: [build-llamacpp, powershell-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pcai-inference-dll-${{ github.sha }}
          path: bin
      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -MinimumVersion 5.6.1 -MaximumVersion 5.99.99 -Force -Scope CurrentUser
      - name: FFI Integration Tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = "Tests/Integration/FFI.Inference.Tests.ps1"
          $config.Run.Exit = $true
          $config.Output.Verbosity = "Detailed"
          $config.Filter.Tag = "FFI"
          Invoke-Pester -Configuration $config
      - name: Module Import Smoke Test
        shell: pwsh
        run: |
          Get-ChildItem -Path Modules -Directory | ForEach-Object {
              $manifest = Join-Path $_.FullName "$($_.Name).psd1"
              if (Test-Path $manifest) {
                  Import-Module $manifest -Force -ErrorAction Stop
                  Write-Host "  $($_.Name) imported" -ForegroundColor Green
              }
          }

  # ──────────────────────────────────────────────────────────────
  # .NET
  # ──────────────────────────────────────────────────────────────
  # No job built any .NET project before this one. dependabot watches all five
  # csproj files (.github/dependabot.yml), so a bump to PcaiServiceHost or to
  # either test project could satisfy every gate while leaving that project
  # unable to restore or compile -- nothing compiled it. The only .NET build
  # that ever ran was in portable-ci.yml, which built PcaiNative alone, on
  # Linux, and turned failures into warnings.
  dotnet-build:
    name: .NET Build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Both SDKs: four projects target net8.0, but PcaiChatTui.Tests targets
      # net10.0 -- a test project on a newer TFM than the code it exercises.
      # That builds locally where the 10.x SDK is installed and would fail on a
      # runner given only 8.0.x, which is part of why this gap went unnoticed.
      # Installing both makes the gate work today; aligning the TFMs is a
      # separate decision.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build every .NET project
        shell: pwsh
        run: |
          $projects = @(Get-ChildItem -Path Native -Recurse -Filter *.csproj |
              Where-Object { $_.FullName -notmatch '[\\/](bin|obj)[\\/]' })
          # Positive control: a discovery glob that silently matches nothing is
          # not a gate. Fail loudly if the project set shrinks unexpectedly.
          if ($projects.Count -lt 5) {
              throw "Expected at least 5 .csproj files under Native/, found $($projects.Count)"
          }
          Write-Host "Building $($projects.Count) projects" -ForegroundColor Cyan
          foreach ($p in $projects) {
              Write-Host "== $($p.Name)" -ForegroundColor Cyan
              dotnet build $p.FullName -c Release --nologo -v minimal
              if ($LASTEXITCODE -ne 0) { throw "dotnet build failed: $($p.Name)" }
          }
      - name: Run .NET test projects
        shell: pwsh
        run: |
          $tests = @(Get-ChildItem -Path Native -Recurse -Filter *.Tests.csproj |
              Where-Object { $_.FullName -notmatch '[\\/](bin|obj)[\\/]' })
          if ($tests.Count -lt 1) { throw "Expected at least 1 .NET test project, found 0" }
          foreach ($t in $tests) {
              Write-Host "== $($t.Name)" -ForegroundColor Cyan
              dotnet test $t.FullName -c Release --nologo -v minimal
              if ($LASTEXITCODE -ne 0) { throw "dotnet test failed: $($t.Name)" }
          }

  # ──────────────────────────────────────────────────────────────
  # Gate (required status check for branch protection)
  # ──────────────────────────────────────────────────────────────

  gate:
    name: CI Gate
    runs-on: windows-latest
    timeout-minutes: 5
    if: always()
    needs:
      - security-scan
      - rust-fmt
      - powershell-lint
      - rust-check
      - rust-test
      - powershell-test
      - build-llamacpp
      - integration-tests
      - dotnet-build
    steps:
      - name: Evaluate Results
        shell: pwsh
        run: |
          $results = @(
            '${{ needs.security-scan.result }}',
            '${{ needs.rust-fmt.result }}',
            '${{ needs.powershell-lint.result }}',
            '${{ needs.rust-check.result }}',
            '${{ needs.rust-test.result }}',
            '${{ needs.powershell-test.result }}',
            '${{ needs.build-llamacpp.result }}',
            '${{ needs.integration-tests.result }}',
            '${{ needs.dotnet-build.result }}'
          )
          # 'success' only. No job here carries an `if:`, so the only way a
          # gated job skips is an upstream `needs` failing -- and that upstream
          # already fails the gate. Accepting 'skipped' bought nothing and let a
          # job that quietly stopped running report green indefinitely.
          $failed = $results | Where-Object { $_ -ne 'success' }
          if ($failed) {
            Write-Host "CI Gate FAILED" -ForegroundColor Red
            Write-Host "Non-success results: $($failed -join ', ')" -ForegroundColor Red
            exit 1
          }
          Write-Host "CI Gate PASSED - all 9 checks succeeded" -ForegroundColor Green
