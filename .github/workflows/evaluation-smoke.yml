name: Evaluation Smoke

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: "Dataset name"
        required: false
        default: "diagnostic"
      max_test_cases:
        description: "Max test cases"
        required: false
        default: "3"
      base_url:
        description: "Mock server base URL"
        required: false
        default: "http://127.0.0.1:9911"

jobs:
  eval-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Start Mock LLM Server
        shell: pwsh
        run: |
          $port = 9911
          $serverPath = Join-Path $env:RUNNER_TEMP "pcai_eval_mock_server.py"
          @"
          import json
          from http.server import BaseHTTPRequestHandler, HTTPServer

          class Handler(BaseHTTPRequestHandler):
              def _send(self, code, payload):
                  body = json.dumps(payload).encode("utf-8")
                  self.send_response(code)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def do_GET(self):
                  if self.path in ("/health", "/negative/health"):
                      return self._send(200, {"status": "ready", "backend": "mock"})
                  if self.path == "/v1/models":
                      return self._send(200, {"data": [{"id": "mock-model"}]})
                  return self._send(404, {"error": "not found"})

              def do_POST(self):
                  if self.path == "/negative/v1/completions":
                      return self._send(500, {"error": "synthetic completion failure"})
                  if self.path == "/v1/completions":
                      length = int(self.headers.get("Content-Length", "0") or 0)
                      if length:
                          self.rfile.read(length)
                      return self._send(200, {"choices": [{"text": "ok"}]})
                  return self._send(404, {"error": "not found"})

          if __name__ == "__main__":
              server = HTTPServer(("127.0.0.1", $port), Handler)
              print("mock server ready")
              server.serve_forever()
          "@ | Set-Content -Path $serverPath -Encoding UTF8
          $proc = Start-Process -FilePath python -ArgumentList $serverPath -WindowStyle Hidden -PassThru
          Start-Sleep -Seconds 2
          if ($proc.HasExited) {
            throw "Mock server failed to start."
          }
          $proc.Id | Out-File -FilePath (Join-Path $env:RUNNER_TEMP "pcai_eval_server.pid") -Encoding ascii

      - name: Run Evaluation Smoke
        shell: pwsh
        env:
          PCAI_SMOKE_BASE_URL: ${{ inputs.base_url }}
          PCAI_SMOKE_DATASET: ${{ inputs.dataset }}
          PCAI_SMOKE_MAX_CASES: ${{ inputs.max_test_cases }}
        run: |
          $baseUrl = $env:PCAI_SMOKE_BASE_URL
          $dataset = $env:PCAI_SMOKE_DATASET
          $max = [int]$env:PCAI_SMOKE_MAX_CASES
          pwsh .\Tests\Evaluation\Invoke-InferenceEvaluation.ps1 `
            -Backend http `
            -BaseUrl $baseUrl `
            -Dataset $dataset `
            -MaxTestCases $max `
            -MinimumPassRate 0 `
            -RunLabel ci-smoke `
            -ProgressMode stream `
            -OutputRoot .\.pcai\evaluation\runs

      - name: Verify failed evaluation leaves its report
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $root = Join-Path $PWD '.pcai/evaluation/runs'
          $summary = Join-Path $root 'negative-control.json'
          pwsh -NoProfile -File ./Tests/Evaluation/Invoke-InferenceEvaluation.ps1 `
            -Backend http -BaseUrl 'http://127.0.0.1:9911/negative' -Dataset general `
            -MaxTestCases 1 -MinimumPassRate 0 -OutputRoot $root -OutputPath $summary `
            -ProgressMode silent
          if ($LASTEXITCODE -eq 0) { throw 'Failed completion returned success.' }
          $acceptance = (Get-Content -LiteralPath $summary -Raw | ConvertFrom-Json).Acceptance
          if ($acceptance.Accepted -ne $false -or $acceptance.Reason -ne 'CaseErrors' -or
              $acceptance.ErrorCases -ne 1 -or $acceptance.CompletedCases -ne 1) {
            throw 'The failed completion did not produce the expected rejection report.'
          }
          exit 0

      - name: Stop Mock Server
        if: always()
        shell: pwsh
        run: |
          $pidFile = Join-Path $env:RUNNER_TEMP "pcai_eval_server.pid"
          if (Test-Path $pidFile) {
            $mockServerPid = Get-Content $pidFile | Select-Object -First 1
            Stop-Process -Id $mockServerPid -Force -ErrorAction SilentlyContinue
          }

      - name: Upload Evaluation Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          retention-days: 1
          name: evaluation-smoke
          path: .pcai/evaluation/runs/**
          if-no-files-found: warn
