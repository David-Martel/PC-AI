name: FunctionGemma runtime

on:
  pull_request:
    branches: [main]
    paths:
      - 'Deploy/rust-functiongemma-runtime/**'
      - 'Deploy/Cargo.toml'
      - 'Deploy/Cargo.lock'
      - '.github/workflows/functiongemma-runtime.yml'
      - '.github/actions/setup-job-rust/**'
  push:
    branches: [main]
    paths:
      - 'Deploy/rust-functiongemma-runtime/**'
      - 'Deploy/Cargo.toml'
      - 'Deploy/Cargo.lock'
      - '.github/workflows/functiongemma-runtime.yml'
      - '.github/actions/setup-job-rust/**'

# A rebased or re-pushed pull request cancels the run it superseded; a push to main is never cancelled.
concurrency:
  group: functiongemma-runtime-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  runtime-tests:
    # Protects: the default runtime JSON/HTTP contracts and public Rust examples.
    # Detects: locked dependency, router response and doctest compilation regressions.
    # Needs: Rust stable and loopback sockets; no model weights or GPU.
    # Breadcrumb: Deploy/rust-functiongemma-runtime/{src,tests}/
    # Scope and limitations: docs/functiongemma-runtime-validation.md
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    # Linux runs on the vigil1 runner (hosted Actions minutes are budget-blocked), except for fork
    # pull requests and a disabled runner, which keep ubuntu-latest so fork code never reaches
    # self-hosted hardware (the same gate as linux-ci.yml). Windows stays hosted for now.
    runs-on: ${{ matrix.os == 'windows-latest' && 'windows-latest' || (vars.PCAI_LINUX_RUNNER_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","Linux","X64","pc-ai-local"]') || 'ubuntu-latest' }}
    # Bounds a cold CPU-only build/test job; timeout is failure, never a pass.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      # The dtm-super-nuc pool image installs no Rust ("cargo: command not found" since the move
      # off vigil1). A job-local toolchain, as linux-ci.yml and portable-bootstrap.yml use, leaves
      # the persistent runner's toolchain homes and profiles untouched.
      - name: Set up job-local self-hosted Rust
        if: runner.environment == 'self-hosted'
        uses: ./.github/actions/setup-job-rust
      - uses: dtolnay/rust-toolchain@stable
        if: runner.environment != 'self-hosted'
      - name: Test locked default runtime and documentation examples
        run: cargo test --locked --manifest-path Deploy/Cargo.toml -p rust-functiongemma-runtime
