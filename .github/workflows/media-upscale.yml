name: Media upscale contracts

on:
  pull_request:
    branches: [main]
    paths:
      - 'Native/pcai_core/pcai_media/**'
      - 'Native/pcai_core/pcai_media_model/**'
      - 'Native/pcai_core/Cargo.toml'
      - 'Native/pcai_core/Cargo.lock'
      - '.github/workflows/media-upscale.yml'
      - '.cargo/config.toml'
  push:
    branches: [main]
    paths:
      - 'Native/pcai_core/pcai_media/**'
      - 'Native/pcai_core/pcai_media_model/**'
      - 'Native/pcai_core/Cargo.toml'
      - 'Native/pcai_core/Cargo.lock'
      - '.github/workflows/media-upscale.yml'
      - '.cargo/config.toml'

permissions:
  contents: read

jobs:
  upscale-contracts:
    # Protects: the optional ORT loader and default FFI compile/lint contract.
    # Detects: feature-hidden API drift and tensor/file-error regressions.
    # Needs: native linker and downloadable ORT binary; no model or GPU.
    # Scope/review: docs/media-upscale-validation.md
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    # Linux runs on the vigil1 runner (hosted Actions minutes are budget-blocked), except for fork
    # pull requests and a disabled runner, which keep ubuntu-latest so fork code never reaches
    # self-hosted hardware (the same gate as linux-ci.yml). Windows stays hosted for now.
    runs-on: ${{ matrix.os == 'windows-latest' && 'windows-latest' || (vars.PCAI_LINUX_RUNNER_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","Linux","X64","vigil1","pc-ai-local"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        # The self-hosted runner keeps its image toolchain (with clippy and rustfmt), as linux-ci.yml
        # does: installing `stable` there replaces the default toolchain for every later job on it.
        if: runner.environment != 'self-hosted'
      - name: Check default FFI and optional CPU upscale
        run: cargo check --locked --manifest-path Native/pcai_core/Cargo.toml -p pcai-media --features upscale
      - name: Run real tensor and missing-model contracts
        run: cargo test --locked --manifest-path Native/pcai_core/Cargo.toml -p pcai-media --features upscale upscale::tests
      - name: Lint the feature-enabled library
        run: cargo clippy --locked --manifest-path Native/pcai_core/Cargo.toml -p pcai-media --features upscale --lib -- -D warnings
