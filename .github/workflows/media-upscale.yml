name: Media upscale contracts

on:
  pull_request:
    branches: [main]
    paths:
      - 'Native/pcai_core/pcai_media/**'
      - 'Native/pcai_core/pcai_media_model/**'
      - 'Native/pcai_core/Cargo.toml'
      - 'Native/pcai_core/Cargo.lock'
      - '.github/workflows/media-upscale.yml'
      - '.github/actions/setup-job-rust/**'
      - '.cargo/config.toml'
  push:
    branches: [main]
    paths:
      - 'Native/pcai_core/pcai_media/**'
      - 'Native/pcai_core/pcai_media_model/**'
      - 'Native/pcai_core/Cargo.toml'
      - 'Native/pcai_core/Cargo.lock'
      - '.github/workflows/media-upscale.yml'
      - '.github/actions/setup-job-rust/**'
      - '.cargo/config.toml'

# A rebased or re-pushed pull request cancels the run it superseded; a push to main is never cancelled.
concurrency:
  group: media-upscale-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  upscale-contracts:
    # Protects: the optional ORT loader and default FFI compile/lint contract.
    # Detects: feature-hidden API drift, file errors and successful-session regressions.
    # Needs: native linker, ORT library and the checked-in synthetic graph; CPU only.
    # Scope/review: docs/media-upscale-validation.md
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    # Linux uses the pc-ai-local runner role when enabled. Fork pull requests and repositories
    # with the role disabled use ubuntu-latest so fork code never reaches
    # self-hosted hardware (the same gate as linux-ci.yml). Windows stays hosted for now.
    runs-on: ${{ matrix.os == 'windows-latest' && 'windows-latest' || (vars.PCAI_LINUX_RUNNER_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","Linux","X64","pc-ai-local"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v7
      # A job-local Rust toolchain keeps runner images independent of host Rust installs
      # and leaves persistent runner toolchain homes and profiles untouched.
      - name: Set up job-local self-hosted Rust
        if: runner.environment == 'self-hosted'
        uses: ./.github/actions/setup-job-rust
        with:
          components: clippy
      - uses: dtolnay/rust-toolchain@stable
        if: runner.environment != 'self-hosted'
      - name: Check default FFI and optional CPU upscale
        run: cargo check --locked --manifest-path Native/pcai_core/Cargo.toml -p pcai-media --features upscale
      - name: Run real tensor and missing-model contracts
        run: cargo test --locked --manifest-path Native/pcai_core/Cargo.toml -p pcai-media --features upscale upscale::tests
      - name: Run a deterministic CPU ONNX graph
        run: cargo test --locked --manifest-path Native/pcai_core/Cargo.toml -p pcai-media --features upscale --test upscale_cpu_inference
      - name: Lint the feature-enabled library
        run: cargo clippy --locked --manifest-path Native/pcai_core/Cargo.toml -p pcai-media --features upscale --lib -- -D warnings
