name: Native override admission
on:
  pull_request:
    paths:
      - 'Native/PcaiNative/**'
      - 'Native/PcaiNative.Tests/**'
      - 'Tests/Portable/test_native_library_lifetime.py'
      - 'Modules/PC-AI.Acceleration/Private/Initialize-PcaiNative.ps1'
      - 'Tests/Portable/*native_override*'
      - 'Tests/Portable/Test-NativeOverrideAdmission.ps1'
      - 'Tests/Portable/Test-NativeEstimatorAndStatus.ps1'
      - '.github/workflows/native-override-admission.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  admission:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    # Linux runs on the vigil1 runner (hosted Actions minutes are budget-blocked), except for fork
    # pull requests and a disabled runner, which keep ubuntu-latest so fork code never reaches
    # self-hosted hardware (the same gate as linux-ci.yml). Windows stays hosted for now.
    runs-on: ${{ matrix.os == 'windows-latest' && 'windows-latest' || (vars.PCAI_LINUX_RUNNER_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","Linux","X64","vigil1","pc-ai-local"]') || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: '8.0.x'
      - uses: dtolnay/rust-toolchain@stable
        # The self-hosted runner keeps its image toolchain (with clippy and rustfmt), as linux-ci.yml
        # does: installing `stable` there replaces the default toolchain for every later job on it.
        if: runner.environment != 'self-hosted'
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          python-version: '3.12'
      - name: Initializer rejects explicit missing overrides
        shell: pwsh
        run: |
          ./Tests/Portable/Test-NativeOverrideAdmission.ps1
          ./Tests/Portable/Test-NativeEstimatorAndStatus.ps1
      - name: Build host native core
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'pcai-admission-core'
          cargo build --locked --manifest-path Native/pcai_core/Cargo.toml -p pcai_core_lib --no-default-features --target-dir $target
          if ($LASTEXITCODE -ne 0) { throw 'Native core build failed' }
          $filename = if ($IsWindows) { 'pcai_core_lib.dll' } else { 'libpcai_core_lib.so' }
          $artifact = Join-Path $target "debug/$filename"
          if (-not (Test-Path -LiteralPath $artifact -PathType Leaf)) { throw 'Native artifact missing' }
          "PCAI_ADMISSION_REAL_CORE_PATH=$artifact" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Production resolver in fresh processes
        shell: pwsh
        run: |
          uv run --no-project python -m unittest discover -s Tests/Portable -p test_native_override_admission.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Native override admission failed' }
      - name: Temporary native handle ownership
        shell: pwsh
        run: |
          uv run --no-project python -m unittest discover -s Tests/Portable -p test_native_library_lifetime.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Native lifetime regression failed' }
      - name: Full managed suite with real native core and no skips
        shell: pwsh
        run: |
          $env:PCAI_CORE_LIB_PATH = $env:PCAI_ADMISSION_REAL_CORE_PATH
          $env:PCAI_TEST_CORE_DLL = $env:PCAI_ADMISSION_REAL_CORE_PATH
          $results = Join-Path $env:RUNNER_TEMP 'pcai-managed-results'
          dotnet test Native/PcaiNative.Tests/PcaiNative.Tests.csproj -c Release --logger 'trx;LogFileName=native-suite.trx' --results-directory $results
          if ($LASTEXITCODE -ne 0) { throw 'Managed native suite failed' }
          [xml]$report = Get-Content -LiteralPath (Join-Path $results 'native-suite.trx') -Raw
          $counts = $report.TestRun.ResultSummary.Counters
          if ([int]$counts.total -lt 52 -or [int]$counts.failed -ne 0 -or [int]$counts.notExecuted -ne 0 -or [int]$counts.passed -ne [int]$counts.total -or [int]$counts.executed -ne [int]$counts.total) {
            throw "Incomplete native qualification: $($counts.OuterXml)"
          }
