name: Native override admission
on:
  pull_request:
    paths:
      - 'Native/PcaiNative/**'
      - 'Native/PcaiNative.Tests/**'
      - 'Tests/Portable/test_native_library_lifetime.py'
      - 'Modules/PC-AI.Acceleration/Private/Initialize-PcaiNative.ps1'
      - 'Tests/Portable/*native_override*'
      - 'Tests/Portable/Test-NativeOverrideAdmission.ps1'
      - 'Tests/Portable/Test-NativeEstimatorAndStatus.ps1'
      - 'Tests/Portable/Test-NativeLoadedCoreSelection.ps1'
      - 'Tests/Portable/Test-NativeDefaultLoaderReuse.ps1'
      - 'Native/pcai_core/pcai_core_lib/**'
      - 'Native/pcai_core/pcai_media/**'
      - 'Native/pcai_core/pcai_media_model/**'
      - 'Native/pcai_core/Cargo.toml'
      - 'Native/pcai_core/Cargo.lock'
      - '.github/workflows/native-override-admission.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  admission:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          python-version: '3.12'
      - name: Initializer rejects explicit missing overrides
        shell: pwsh
        run: |
          ./Tests/Portable/Test-NativeOverrideAdmission.ps1
          ./Tests/Portable/Test-NativeEstimatorAndStatus.ps1
      - name: Build host native core and CPU-only media
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'pcai-admission-core'
          cargo build --locked --manifest-path Native/pcai_core/Cargo.toml -p pcai_core_lib -p pcai-media --no-default-features --features pcai-media/ffi --target-dir $target
          if ($LASTEXITCODE -ne 0) { throw 'Native core/CPU media build failed' }
          $filename = if ($IsWindows) { 'pcai_core_lib.dll' } else { 'libpcai_core_lib.so' }
          $artifact = Join-Path $target "debug/$filename"
          if (-not (Test-Path -LiteralPath $artifact -PathType Leaf)) { throw 'Native artifact missing' }
          "PCAI_ADMISSION_REAL_CORE_PATH=$artifact" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $mediaName = if ($IsWindows) { 'pcai_media.dll' } else { 'libpcai_media.so' }
          $media = Join-Path $target "debug/$mediaName"
          if (-not (Test-Path -LiteralPath $media -PathType Leaf)) { throw 'CPU media artifact missing' }
          "PCAI_TEST_MEDIA_DLL=$media" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          'PCAI_TEST_CPU_MEDIA=1' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Production resolver in fresh processes
        shell: pwsh
        run: |
          uv run --no-project python -m unittest discover -s Tests/Portable -p test_native_override_admission.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Native override admission failed' }
      - name: Temporary native handle ownership
        shell: pwsh
        run: |
          uv run --no-project python -m unittest discover -s Tests/Portable -p test_native_library_lifetime.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Native lifetime regression failed' }
      - name: Full managed suite with real native core and no skips
        shell: pwsh
        run: |
          $env:PCAI_CORE_LIB_PATH = $env:PCAI_ADMISSION_REAL_CORE_PATH
          $env:PCAI_TEST_CORE_DLL = $env:PCAI_ADMISSION_REAL_CORE_PATH
          $results = Join-Path $env:RUNNER_TEMP 'pcai-managed-results'
          dotnet test Native/PcaiNative.Tests/PcaiNative.Tests.csproj -c Release --logger 'trx;LogFileName=native-suite.trx' --results-directory $results
          if ($LASTEXITCODE -ne 0) { throw 'Managed native suite failed' }
          [xml]$report = Get-Content -LiteralPath (Join-Path $results 'native-suite.trx') -Raw
          $counts = $report.TestRun.ResultSummary.Counters
          if ([int]$counts.total -lt 68 -or [int]$counts.failed -ne 0 -or [int]$counts.notExecuted -ne 0 -or [int]$counts.passed -ne [int]$counts.total -or [int]$counts.executed -ne [int]$counts.total) {
            throw "Incomplete native qualification: $($counts.OuterXml)"
          }
      - name: Loaded identity and default-loader reuse controls
        shell: pwsh
        run: |
          $targetPaths = @(& dotnet msbuild Native/PcaiNative/PcaiNative.csproj -nologo -property:Configuration=Release -getProperty:TargetPath)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot evaluate the built managed bridge TargetPath' }
          $targetPaths = @($targetPaths | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($targetPaths.Count -ne 1 -or -not [IO.Path]::IsPathFullyQualified($targetPaths[0].Trim())) {
            throw 'Expected one absolute managed bridge TargetPath'
          }
          $wrapper = [IO.Path]::GetFullPath($targetPaths[0].Trim())
          $artifact = Get-Item -LiteralPath $wrapper -ErrorAction Stop
          if ($artifact.PSIsContainer -or $artifact.Name -cne 'PcaiNative.dll' -or $artifact.Length -le 0) {
            throw 'Evaluated managed bridge artifact is missing or invalid'
          }
          $compiler = (Get-Command clang -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
          ./Tests/Portable/Test-NativeLoadedCoreSelection.ps1 -WrapperPath $wrapper -CompilerPath $compiler
          ./Tests/Portable/Test-NativeDefaultLoaderReuse.ps1 -WrapperPath $wrapper -CompilerPath $compiler
