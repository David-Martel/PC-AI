name: Portable bootstrap
on:
  pull_request:
    branches: [main]
    paths:
      - 'Modules/PC-AI.Common/**'
      - 'Modules/PC-AI.Acceleration/Private/Initialize-RustTools.ps1'
      - 'Native/PcaiNative/**'
      - 'Native/pcai_core/**'
      # Native resolves optional train/core path dependencies from the Deploy workspace.
      - 'Deploy/Cargo.toml'
      - 'Deploy/Cargo.lock'
      - 'Deploy/**/Cargo.toml'
      - 'Tests/Portable/**'
      - 'vendor/candle-core-*/**'
      - 'vendor/candle-core-provenance.json'
      - 'vendor/patches/**'
      - 'Tools/verify_candle_vendor.py'
      - 'Tools/Test-PcaiModuleManifests.ps1'
      - 'lefthook.yml'
      - 'Tests/Invoke-BenchmarkGate.ps1'
      - 'Tests/Benchmarks/Invoke-PcaiToolingBenchmarks.ps1'
      - 'Config/pcai-tooling-benchmarks.json'
      - 'Config/machine-profiles/dtm-super-nuc.json'
      - '.github/workflows/portable-bootstrap.yml'
  push:
    branches: [main]
    paths:
      - 'Modules/PC-AI.Common/**'
      - 'Modules/PC-AI.Acceleration/Private/Initialize-RustTools.ps1'
      - 'Native/PcaiNative/**'
      - 'Native/pcai_core/**'
      # Native resolves optional train/core path dependencies from the Deploy workspace.
      - 'Deploy/Cargo.toml'
      - 'Deploy/Cargo.lock'
      - 'Deploy/**/Cargo.toml'
      - 'Tests/Portable/**'
      - 'vendor/candle-core-*/**'
      - 'vendor/candle-core-provenance.json'
      - 'vendor/patches/**'
      - 'Tools/verify_candle_vendor.py'
      - 'Tools/Test-PcaiModuleManifests.ps1'
      - 'lefthook.yml'
      - 'Tests/Invoke-BenchmarkGate.ps1'
      - 'Tests/Benchmarks/Invoke-PcaiToolingBenchmarks.ps1'
      - 'Config/pcai-tooling-benchmarks.json'
      - 'Config/machine-profiles/dtm-super-nuc.json'
      - '.github/workflows/portable-bootstrap.yml'
permissions:
  contents: read
jobs:
  bootstrap:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    # Linux runs on the vigil1 runner (hosted Actions minutes are budget-blocked), except for fork
    # pull requests and a disabled runner, which keep ubuntu-latest so fork code never reaches
    # self-hosted hardware (the same gate as linux-ci.yml). Windows stays hosted for now.
    runs-on: ${{ matrix.os == 'windows-latest' && 'windows-latest' || (vars.PCAI_LINUX_RUNNER_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","Linux","X64","pc-ai-local"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version: '3.12'
          enable-cache: false
      - uses: actions/setup-dotnet@v6
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: '8.0.x'
      - name: Validate runtime identifier against actual host
        shell: pwsh
        env:
          EXPECTED_RID: ${{ matrix.rid }}
        run: |
          $os = if ($IsWindows) { 'win' } elseif ($IsLinux) { 'linux' } else { throw 'Unsupported runner OS' }
          $arch = [Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString().ToLowerInvariant()
          if ("$os-$arch" -ne $env:EXPECTED_RID) { throw 'Runner and target RID differ' }
      - name: Profile-free cache bootstrap regression
        shell: pwsh
        run: |
          ./Tests/Portable/Test-CacheBootstrap.ps1
          ./Tests/Portable/Test-RustToolDiscovery.ps1
          ./Tests/Portable/Test-ModuleManifestHook.ps1
          ./Tools/Test-PcaiModuleManifests.ps1
      - name: Benchmark admission regression controls
        shell: pwsh
        run: |
          ./Tests/Portable/Test-BenchmarkRunner.ps1
          uv run --no-project python -m unittest discover -s Tests/Portable -p test_benchmark_admission.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Apply NUC native build budget
        if: runner.environment == 'self-hosted' && startsWith(runner.name, 'dtm-super-nuc-pool-pc-ai-')
        shell: pwsh
        run: |
          $machineProfile = Get-Content ./Config/machine-profiles/dtm-super-nuc.json -Raw | ConvertFrom-Json
          $buildJobs = $machineProfile.buildPolicy.maxNativeBuildJobs
          if ($machineProfile.hostName -ne 'dtm-super-nuc' -or
              ($buildJobs -isnot [int] -and $buildJobs -isnot [long]) -or
              $buildJobs -lt 1 -or $buildJobs -gt [int]::MaxValue) {
            throw 'The NUC native build budget must be a positive JSON integer'
          }
          if (-not [string]::IsNullOrEmpty($env:CARGO_BUILD_JOBS)) {
            $existingJobs = 0
            if ($env:CARGO_BUILD_JOBS -notmatch '^[1-9][0-9]*$' -or
                -not [int]::TryParse($env:CARGO_BUILD_JOBS, [ref]$existingJobs)) {
              throw 'The existing Cargo build budget must be a positive integer'
            }
            $buildJobs = [Math]::Min($buildJobs, $existingJobs)
          }
          "CARGO_BUILD_JOBS=$buildJobs" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Prepare job-local self-hosted Rust homes
        if: runner.environment == 'self-hosted'
        id: self_hosted_rust
        shell: pwsh
        run: |
          foreach ($name in 'RUNNER_TEMP', 'GITHUB_ENV', 'GITHUB_PATH', 'GITHUB_OUTPUT') {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($value) -or $value -match "[\r\n]") { throw "$name is required" }
          }
          $rustRoot = Join-Path $env:RUNNER_TEMP ('pcai-rust-' + [Guid]::NewGuid().ToString('N'))
          $cargoHome = Join-Path $rustRoot 'cargo'
          $rustupHome = Join-Path $rustRoot 'rustup'
          $profileHome = Join-Path $rustRoot 'home'
          $cargoBin = Join-Path $cargoHome 'bin'
          New-Item -ItemType Directory -Path $cargoHome, $rustupHome, $profileHome, $cargoBin -ErrorAction Stop | Out-Null
          "CARGO_HOME=$cargoHome", "RUSTUP_HOME=$rustupHome" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $cargoBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "home=$profileHome" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Install job-local self-hosted Rust
        if: runner.environment == 'self-hosted'
        uses: dtolnay/rust-toolchain@stable
        env:
          # The Linux installer may edit profiles; keep HOME and ZDOTDIR job-local too.
          HOME: ${{ steps.self_hosted_rust.outputs.home }}
          ZDOTDIR: ${{ steps.self_hosted_rust.outputs.home }}
      - uses: dtolnay/rust-toolchain@stable
        if: runner.environment != 'self-hosted'
      # Protects all three locked Candle versions and exact published-source custody.
      # Detects conflicting local/central archive headers through actual CPU readers.
      # Needs no CUDA/model/native DLL; see the contract's hash-bound review register.
      - name: Verify and exercise strict Candle archive readers
        shell: pwsh
        run: |
          uv run --no-project python Tools/verify_candle_vendor.py
          if ($LASTEXITCODE -ne 0) { throw 'Candle source custody failed' }
          uv run --no-project python -m unittest discover -s Tests/Portable -p test_candle_vendor.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Candle custody controls failed' }
          cargo test --locked --manifest-path Tests/Portable/candle-zip-security/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Candle archive contracts failed' }
      - name: Build real core and verify Unicode token parity
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'pcai-parity-core'
          cargo build --locked --manifest-path Native/pcai_core/Cargo.toml -p pcai_core_lib --no-default-features --target-dir $target
          if ($LASTEXITCODE -ne 0) { throw 'Native core build failed' }
          $filename = if ($IsWindows) { 'pcai_core_lib.dll' } else { 'libpcai_core_lib.so' }
          $env:PCAI_TOKEN_NATIVE_PATH = Join-Path $target "debug/$filename"
          # Nested script invocation exercises closure scope under the CI wrapper.
          ./Tests/Portable/Test-TokenBenchmarkParity.ps1
      - name: Build managed bridge for host
        shell: pwsh
        env:
          TARGET_RID: ${{ matrix.rid }}
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        run: |
          dotnet build Native/PcaiNative/PcaiNative.csproj --configuration Release --runtime $env:TARGET_RID --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
