name: Release Native Binaries

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags (v1.0.0, v0.1.0-beta, etc.)
  workflow_dispatch:  # Build and upload run artifacts from the selected ref.

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions: {}

jobs:
  test:
    name: Unit Tests
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      source_ref: ${{ steps.source.outputs.source_ref }}
      source_commit: ${{ steps.source.outputs.source_commit }}
      release_tag: ${{ steps.source.outputs.release_tag }}
      release_version: ${{ steps.source.outputs.release_version }}
    steps:
      - uses: actions/checkout@v7
        id: source_checkout
        with:
          persist-credentials: false

      - name: Verify Source Revision
        id: source
        shell: pwsh
        env:
          PCAI_CHECKOUT_REF: ${{ steps.source_checkout.outputs.ref }}
          PCAI_CHECKOUT_COMMIT: ${{ steps.source_checkout.outputs.commit }}
        run: |
          if ($env:GITHUB_SHA -cnotmatch '\A[0-9a-f]{40}\z' -or $env:PCAI_CHECKOUT_COMMIT -cne $env:GITHUB_SHA) {
            throw 'The checkout does not match the event source commit.'
          }

          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            "source_ref=$env:GITHUB_SHA" >> $env:GITHUB_OUTPUT
            "source_commit=$env:GITHUB_SHA" >> $env:GITHUB_OUTPUT
            return
          }

          # The existing build version contract accepts vMAJOR.MINOR.PATCH
          # and optional SemVer prerelease identifiers.
          $numeric = '(?:0|[1-9][0-9]*)'
          $identifier = "(?:$numeric|[0-9]*[A-Za-z-][0-9A-Za-z-]*)"
          $tagPattern = "\Av$numeric\.$numeric\.$numeric(?:-$identifier(?:\.$identifier)*)?\z"
          $tag = $env:GITHUB_REF_NAME
          $tagRef = "refs/tags/$tag"
          if ($env:GITHUB_EVENT_NAME -ne 'push' -or $env:GITHUB_REF_TYPE -ne 'tag' -or
              $tag -cnotmatch $tagPattern -or $env:GITHUB_REF -cne $tagRef -or $env:PCAI_CHECKOUT_REF -cne $tagRef) {
            throw 'A supported pushed release tag and checkout of that exact ref are required.'
          }

          "source_ref=$tagRef" >> $env:GITHUB_OUTPUT
          "source_commit=$env:GITHUB_SHA" >> $env:GITHUB_OUTPUT
          "release_tag=$tag" >> $env:GITHUB_OUTPUT
          "release_version=$($tag.Substring(1))" >> $env:GITHUB_OUTPUT

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: Native/pcai_core/pcai_inference
          shared-key: pcai-inference-test

      - name: Run Unit Tests
        shell: pwsh
        run: |
          .\Build.ps1 -Component inference -Configuration Release -RunTests
          if ($LASTEXITCODE -ne 0) { throw "Build.ps1 test phase failed with exit code $LASTEXITCODE" }

  build:
    name: Build ${{ matrix.backend }} (${{ matrix.cuda && 'CUDA' || 'CPU' }})
    needs: test
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        backend: [llamacpp, mistralrs]
        cuda: [true, false]
    steps:
      - uses: actions/checkout@v7
        id: source_checkout
        with:
          ref: ${{ needs.test.outputs.source_ref }}
          persist-credentials: false

      - name: Reject a moved build ref
        if: steps.source_checkout.outputs.commit != needs.test.outputs.source_commit
        shell: pwsh
        run: throw 'Build checkout does not match the verified source commit.'

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja -y

      - name: Install CUDA Toolkit
        if: matrix.cuda
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '13.1.0'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "cublas", "curand", "cusolver", "cusparse"]'

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: Native/pcai_core/pcai_inference
          shared-key: pcai-inference-${{ matrix.backend }}-${{ matrix.cuda && 'cuda' || 'cpu' }}

      - name: Set Build Environment
        shell: pwsh
        run: |
          $clPath = (Get-Command cl.exe).Source
          echo "CC=$clPath" >> $env:GITHUB_ENV
          echo "CXX=$clPath" >> $env:GITHUB_ENV
          echo "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV

          if ('${{ matrix.cuda }}' -eq 'true') {
            echo "CUDA_PATH=$env:CUDA_PATH" >> $env:GITHUB_ENV
            echo "LLAMA_CUDA=1" >> $env:GITHUB_ENV
            echo "GGML_CUDA=ON" >> $env:GITHUB_ENV
            # Target architectures: Turing (75), Ampere (80, 86), Ada (89), Blackwell (120)
            echo "CUDAARCHS=75;80;86;89;120" >> $env:GITHUB_ENV
            # Force dynamic CRT for CUDA compatibility
            echo "RUSTFLAGS=-Ctarget-feature=-crt-static" >> $env:GITHUB_ENV
          }

      - name: Set CUDA Compiler Flags
        if: matrix.cuda
        shell: pwsh
        run: |
          $crtFlag = '/MD'
          echo "CL=$crtFlag" >> $env:GITHUB_ENV
          echo "_CL_=$crtFlag" >> $env:GITHUB_ENV
          echo "CUDA_NVCC_FLAGS=$crtFlag" >> $env:GITHUB_ENV
          echo "NVCCFLAGS=--compiler-options $crtFlag" >> $env:GITHUB_ENV
          echo "CMAKE_ARGS=-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL" >> $env:GITHUB_ENV

      - name: Determine Features
        id: features
        shell: pwsh
        run: |
          $backend = '${{ matrix.backend }}'
          $cuda = '${{ matrix.cuda }}' -eq 'true'

          $features = @('ffi', 'server')

          if ($backend -eq 'llamacpp') {
            $features += 'llamacpp'
            if ($cuda) { $features += 'cuda-llamacpp' }
            $binName = 'pcai-llamacpp'
          } else {
            $features += 'mistralrs-backend'
            if ($cuda) { $features += 'cuda-mistralrs' }
            $binName = 'pcai-mistralrs'
          }

          $featureString = $features -join ','
          echo "FEATURES=$featureString" >> $env:GITHUB_OUTPUT
          echo "BIN_NAME=$binName" >> $env:GITHUB_OUTPUT

          Write-Host "Building $binName with features: $featureString"

      - name: Set Version Info
        id: version_info
        shell: pwsh
        env:
          PCAI_EXPECTED_RELEASE_VERSION: ${{ needs.test.outputs.release_version }}
        run: |
          # Use Get-BuildVersion.ps1 to set version environment variables
          $versionInfo = .\Tools\Get-BuildVersion.ps1 -SetEnv -Quiet
          if ($env:PCAI_EXPECTED_RELEASE_VERSION -and $versionInfo.SemVer -cne $env:PCAI_EXPECTED_RELEASE_VERSION) {
            throw 'Native build version does not match the verified release tag.'
          }

          Write-Host "Version: $($versionInfo.Version)" -ForegroundColor Cyan
          Write-Host "Git: $($versionInfo.GitHashShort) ($($versionInfo.GitBranch))" -ForegroundColor Cyan

          # Export to GitHub Actions
          echo "PCAI_VERSION=$($versionInfo.Version)" >> $env:GITHUB_OUTPUT
          echo "PCAI_SEMVER=$($versionInfo.SemVer)" >> $env:GITHUB_OUTPUT
          echo "PCAI_GIT_HASH_SHORT=$($versionInfo.GitHashShort)" >> $env:GITHUB_OUTPUT

      - name: Build Binary
        shell: pwsh
        env:
          PCAI_VERSION: ${{ steps.version_info.outputs.PCAI_VERSION }}
          PCAI_BUILD_VERSION: ${{ steps.version_info.outputs.PCAI_VERSION }}
        run: |
          $backend = '${{ matrix.backend }}'
          $cuda = '${{ matrix.cuda }}' -eq 'true'

          Write-Host "======================================" -ForegroundColor Cyan
          Write-Host " Building pcai-inference ($backend)" -ForegroundColor Cyan
          Write-Host " Version: $env:PCAI_VERSION" -ForegroundColor Cyan
          Write-Host "======================================" -ForegroundColor Cyan

          # Use unified Build.ps1 for consistent artifact handling
          $buildArgs = @{
            Component = $backend
            Configuration = 'Release'
          }
          if ($cuda) { $buildArgs['EnableCuda'] = $true }

          .\Build.ps1 @buildArgs

          if ($LASTEXITCODE -ne 0) {
            throw "Build failed with exit code $LASTEXITCODE"
          }

      - name: Prepare Artifact
        id: artifact
        shell: pwsh
        env:
          PCAI_EXPECTED_SOURCE_COMMIT: ${{ needs.test.outputs.source_commit }}
        run: |
          $backend = '${{ matrix.backend }}'
          $cuda = '${{ matrix.cuda }}' -eq 'true'
          $variant = if ($cuda) { 'cuda' } else { 'cpu' }
          $artifactName = "pcai-inference-$backend-$variant-win64"

          # Build.ps1 resolves Cargo's real target root and stages the P/Invoke alias here.
          $binName = '${{ steps.features.outputs.BIN_NAME }}'
          $artifactDir = ".pcai\build\artifacts\$binName"
          $payloadNames = @("$binName.exe", 'pcai_inference.dll', 'pcai_inference_lib.dll')
          foreach ($file in $payloadNames) {
            $sourcePath = Join-Path $artifactDir $file
            $sourceFile = Get-Item -LiteralPath $sourcePath -ErrorAction SilentlyContinue
            if ($null -eq $sourceFile -or $sourceFile.PSIsContainer -or $sourceFile.Length -le 0) {
              throw "Missing or empty required staged native release file: $sourcePath"
            }
          }

          $nativeExecutable = Join-Path $artifactDir "$binName.exe"
          $versionOutput = & $nativeExecutable --version-json
          if ($LASTEXITCODE -ne 0) {
            throw "Staged native version query failed with exit code $LASTEXITCODE."
          }
          try {
            $identity = ($versionOutput -join [Environment]::NewLine) | ConvertFrom-Json -ErrorAction Stop
          }
          catch {
            throw 'Staged native version query did not return JSON.'
          }
          if ($env:PCAI_EXPECTED_SOURCE_COMMIT -cnotmatch '\A[0-9a-f]{40}\z' -or
              $identity.git_hash -isnot [string] -or $identity.git_hash -cne $env:PCAI_EXPECTED_SOURCE_COMMIT) {
            throw 'Staged native executable source commit does not match the admitted revision.'
          }
          if ($identity.target -isnot [string] -or $identity.target -cne 'x86_64-pc-windows-msvc' -or
              $identity.profile -isnot [string] -or $identity.profile -cne 'release') {
            throw 'Staged native executable target or profile is incompatible with the Windows x64 release.'
          }
          # has_cuda describes the build host's toolkit; Cargo features identify the binary variant.
          $expectedFeatures = @($backend, 'ffi', 'server')
          if ($cuda) { $expectedFeatures += "cuda-$backend" }
          if ($identity.features -isnot [string] -or
              (($identity.features -csplit ',' | Sort-Object) -join ',') -cne
                (($expectedFeatures | Sort-Object) -join ',')) {
            throw 'Staged native executable feature set does not match the requested variant.'
          }

          $stagingDir = "staging\$artifactName"
          New-Item -ItemType Directory -Path $stagingDir -Force | Out-Null
          $packageFiles = foreach ($file in $payloadNames) {
            Copy-Item -LiteralPath (Join-Path $artifactDir $file) -Destination $stagingDir -Force
            Join-Path $stagingDir $file
          }

          # Create README.
          #
          # DO NOT use a PowerShell here-string here. A here-string terminator
          # ("@) must sit at column 0, which breaks out of this YAML block
          # scalar and makes the whole file invalid YAML -- the previous version
          # of this step did exactly that, so release-cuda.yml could never be
          # loaded and this release workflow had never run once. Build the text
          # from an indented array instead.
          $backendConfig = if ($backend -eq 'llamacpp') {
            @{ type = 'llama_cpp' }
          } else {
            [ordered]@{ type = 'mistral_rs'; device = $(if ($cuda) { 'auto' } else { 'cpu' }) }
          }
          $configExample = [ordered]@{
            backend = $backendConfig
            model = @{ path = 'path/to/model.gguf' }
            server = [ordered]@{ host = '127.0.0.1'; port = 8080 }
          } | ConvertTo-Json -Depth 4
          $readmeLines = @(
            "# PC-AI Inference Engine - $backend ($variant)"
            ''
            'Pre-compiled binary for Windows x64.'
            ''
            '## Files'
            "- $binName.exe - Main inference server executable"
            '- pcai_inference*.dll - Shared library for FFI integration'
            ''
            '## Usage'
            ''
            'Create pcai-inference.json beside the executable and set the model path:'
            '```json'
            $configExample
            '```'
            ''
            'Start the server:'
            '```powershell'
            ".\$binName.exe --config .\pcai-inference.json"
            '```'
            ''
            'Check health:'
            '```powershell'
            'Invoke-RestMethod http://127.0.0.1:8080/health'
            '```'
          )

          if ($cuda) {
            $readmeLines += @(
              ''
              '## CUDA Requirements'
              '- Supported NVIDIA GPU and a driver compatible with CUDA 13.x'
              '- CUDA 13.x runtime libraries available to the executable'
              '- Supported GPU architectures: SM 75 (Turing), SM 80/86 (Ampere), SM 89 (Ada), SM 120 (Blackwell)'
            )
          }

          $readmeLines += @(
            ''
            '## System Requirements'
            '- Windows 10/11 x64'
            '- x64 CPU with AVX2 support'
          )
          if (-not $cuda) { $readmeLines += '- No GPU required' }

          $readmeLines += @(
            ''
            '## API Endpoints'
            '- GET  /health - Health check'
            '- GET  /v1/models - List loaded models'
            '- POST /v1/completions - Generate completions'
            '- POST /v1/chat/completions - Chat completions (OpenAI-compatible)'
            ''
            '## More Information'
            'See https://github.com/${{ github.repository }} for full documentation.'
          )

          $readme = $readmeLines -join "`r`n"
          $readmePath = Join-Path $stagingDir 'README.txt'
          $readme | Out-File -LiteralPath $readmePath -Encoding UTF8
          $packageFiles += $readmePath

          # Native archive v1 uses flat names, the admitted commit and the unique artifact name.
          # The manifest hashes the payload; SHA256SUMS hashes the payload and manifest.
          $digests = [Collections.Generic.SortedDictionary[string,string]]::new([StringComparer]::Ordinal)
          foreach ($file in $packageFiles) {
            $digest = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            $digests.Add((Split-Path -Leaf $file), $digest)
          }
          if ($digests['pcai_inference.dll'] -cne $digests['pcai_inference_lib.dll']) {
            throw 'Staged native P/Invoke alias does not match the Cargo library.'
          }
          $manifestPath = Join-Path $stagingDir 'manifest.json'
          $manifest = [ordered]@{
            schemaVersion = 1
            commit = $env:PCAI_EXPECTED_SOURCE_COMMIT
            variant = $artifactName
            files = @(
              foreach ($entry in $digests.GetEnumerator()) {
                [ordered]@{ path = $entry.Key; sha256 = $entry.Value }
              }
            )
          }
          $manifest | ConvertTo-Json -Depth 4 |
            Set-Content -LiteralPath $manifestPath -Encoding utf8NoBOM
          $manifestDigest = (Get-FileHash -LiteralPath $manifestPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $digests.Add('manifest.json', $manifestDigest)

          $checksumsPath = Join-Path $stagingDir 'SHA256SUMS'
          $checksumLines = foreach ($entry in $digests.GetEnumerator()) {
            '{0}  {1}' -f $entry.Value, $entry.Key
          }
          $lineFeed = [string][char]10
          $checksumText = ($checksumLines -join $lineFeed) + $lineFeed
          Set-Content -LiteralPath $checksumsPath -Encoding utf8NoBOM -NoNewline -Value $checksumText
          $packageFiles += @($manifestPath, $checksumsPath)

          Compress-Archive -LiteralPath $packageFiles -DestinationPath "$artifactName.zip" -Force

          echo "ARTIFACT_NAME=$artifactName" >> $env:GITHUB_OUTPUT
          echo "ARTIFACT_PATH=$artifactName.zip" >> $env:GITHUB_OUTPUT

          Write-Host "Created artifact: $artifactName.zip"
          Get-Item -LiteralPath $packageFiles

      # Blocking on purpose: a later job or a release consumes this artifact, so a failed upload
      # must fail here, not publish or test an incomplete set (gemini review, 2026-10-29).
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.ARTIFACT_NAME }}
          path: ${{ steps.artifact.outputs.ARTIFACT_PATH }}
          retention-days: 1

  release:
    name: Create Release
    if: github.event_name == 'push' && github.ref_type == 'tag' && needs.test.outputs.release_tag != ''
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare Release Assets
        id: assets
        shell: bash
        run: |
          mkdir -p release-assets

          # Move all ZIP files to release-assets
          find artifacts -name "*.zip" -exec mv {} release-assets/ \;

          echo "Collected release assets:"
          ls -la release-assets/

      - name: Generate Release Notes
        shell: bash
        env:
          PCAI_RELEASE_VERSION: ${{ needs.test.outputs.release_version }}
          PCAI_SOURCE_COMMIT: ${{ needs.test.outputs.source_commit }}
        run: |
          printf '## PC-AI Inference Engine v%s\n\n' "$PCAI_RELEASE_VERSION" > RELEASE_NOTES.md
          cat >> RELEASE_NOTES.md << 'EOF'

          Pre-compiled native binaries for Windows x64.

          ### Downloads

          **CUDA (GPU-Accelerated)**
          Requires NVIDIA GPU (Turing or newer) + CUDA Toolkit 13.x runtime

          | File | Backend | Best For |
          |------|---------|----------|
          | `pcai-inference-llamacpp-cuda-win64.zip` | llama.cpp | GGUF models (recommended) |
          | `pcai-inference-mistralrs-cuda-win64.zip` | mistral.rs | Mistral/Llama3 with optimizations |

          **CPU-Only**
          No GPU required, runs on any x64 Windows system

          | File | Backend | Notes |
          |------|---------|-------|
          | `pcai-inference-llamacpp-cpu-win64.zip` | llama.cpp | Slower but universal |
          | `pcai-inference-mistralrs-cpu-win64.zip` | mistral.rs | CPU-optimized |

          ### Requirements

          **CUDA builds:**
          - Windows 10/11 x64
          - NVIDIA GPU (RTX 20/30/40 series)
          - CUDA Toolkit 13.x runtime (cudart64_13.dll)

          **CPU builds:**
          - Windows 10/11 x64
          - x64 CPU with AVX2 support

          ### GPU Architecture Support (CUDA builds)
          - SM 75: Turing (RTX 20 series, GTX 16xx)
          - SM 80: Ampere (RTX 30 series)
          - SM 86: Ampere (RTX 30 series mobile/workstation)
          - SM 89: Ada Lovelace (RTX 40 series)

          ### Quick Start

          ```powershell
          # Extract the ZIP
          Expand-Archive pcai-inference-llamacpp-cuda-win64.zip -DestinationPath .

          # Create pcai-inference.json using the archive README and set the model path.
          .\pcai-llamacpp.exe --config .\pcai-inference.json

          # Test the endpoint
          Invoke-RestMethod http://127.0.0.1:8080/health
          ```

          ### API Endpoints
          - `GET /health` - Health check
          - `GET /v1/models` - List loaded models
          - `POST /v1/completions` - Generate completions
          - `POST /v1/chat/completions` - Chat completions (OpenAI-compatible)

          ---
          EOF
          printf 'Built with GitHub Actions from commit %s\n' "$PCAI_SOURCE_COMMIT" >> RELEASE_NOTES.md

      - uses: actions/checkout@v7
        id: source_checkout
        with:
          ref: ${{ needs.test.outputs.source_ref }}
          path: release-source
          persist-credentials: false

      - name: Reject a moved release ref
        if: steps.source_checkout.outputs.commit != needs.test.outputs.source_commit
        shell: bash
        run: |
          echo 'Release tag no longer points to the verified source commit.' >&2
          exit 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.test.outputs.release_tag }}
          target_commitish: ${{ needs.test.outputs.source_commit }}
          name: PC-AI Inference v${{ needs.test.outputs.release_version }}
          body_path: RELEASE_NOTES.md
          files: release-assets/*.zip
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(needs.test.outputs.release_version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
