name: USB4 lifecycle contracts
on:
  pull_request:
    paths:
      - 'Native/pcai_core/pcai_tb_cli/**'
      - 'Native/pcai_core/Cargo.toml'
      - 'Native/pcai_core/Cargo.lock'
      # Native resolves optional train/core path dependencies from the Deploy workspace.
      - 'Deploy/Cargo.toml'
      - 'Deploy/Cargo.lock'
      - 'Deploy/**/Cargo.toml'
      - 'Config/thunderbolt-peers.json'
      - 'Config/usb4-peer-network.example.json'
      - 'Config/usb4-fleet/**'
      - 'Tools/SystemScripts/Networking/Get-Usb4PeerDeployment.ps1'
      - 'Tools/SystemScripts/Networking/usb4_fleet_release.py'
      - 'Tests/Portable/test_usb4_fleet_release.py'
      - 'Modules/PC-AI.Drivers/Public/Get-ThunderboltNetworkStatus.ps1'
      - 'Tests/Portable/Test-ThunderboltNeighborState.ps1'
      - 'Tests/Portable/Test-Usb4PeerDeployment.ps1'
      - 'Tools/SystemScripts/Networking/Invoke-Usb4PeerNetwork.ps1'
      - 'Tools/SystemScripts/Networking/Install-Usb4PeerNetwork.ps1'
      - 'Tests/Portable/Test-Usb4PeerNetwork.ps1'
      - 'Tests/Portable/Test-Usb4PeerNetworkInstall.ps1'
      - 'Tools/SystemScripts/Networking/Configure-ThunderboltSwitchRoutes.ps1'
      - 'Tools/SystemScripts/Networking/Invoke-ThunderboltRcloneMount.ps1'
      - 'Tools/SystemScripts/Networking/Invoke-ThunderboltEnrolledPeer.ps1'
      - 'Tools/SystemScripts/Networking/Invoke-ThunderboltStartup.ps1'
      - 'Tools/SystemScripts/Networking/Export-ThunderboltEnrolledObserver.sh'
      - 'Tests/Portable/Test-ThunderboltBootReadiness.ps1'
      - 'Tests/Portable/Test-ThunderboltMountGate.ps1'
      - 'Tests/Portable/Test-ThunderboltEnrolledPeer.ps1'
      - 'Tests/Portable/Test-ThunderboltStartup.ps1'
      - '.github/workflows/usb4-lifecycle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lifecycle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1, shared maintained pin
      - name: Fleet release publisher contracts
        shell: pwsh
        run: |
          uv run --no-project --python 3.12 python Tools/SystemScripts/Networking/usb4_fleet_release.py validate
          if ($LASTEXITCODE -ne 0) { throw 'USB4 fleet registry validation failed' }
          uv run --no-project --python 3.12 python Tools/SystemScripts/Networking/usb4_fleet_release.py build --host dtm-p1gen9 --output (Join-Path $env:RUNNER_TEMP 'pcai-usb4-release-plan.zip') --dry-run
          if ($LASTEXITCODE -ne 0) { throw 'USB4 committed-source release plan failed' }
          uv run --no-project --python 3.12 python -m unittest discover -s Tests/Portable -p test_usb4_fleet_release.py -v
          if ($LASTEXITCODE -ne 0) { throw 'USB4 fleet release contracts failed' }
      # Protects the fixed read-only SSH service command; detects shell syntax
      # errors before deployment. Needs POSIX sh; source is root-owned on Linux.
      - name: Fixed observer export syntax
        if: runner.os == 'Linux'
        shell: bash
        run: sh -n Tools/SystemScripts/Networking/Export-ThunderboltEnrolledObserver.sh
      # Protects roaming host startup failure/absence and owned SFTP paths.
      # Detects masked V&V exits and default-LAN fallback without attached hardware.
      # Needs pwsh only; source: Tools/SystemScripts/Networking/*Thunderbolt*.
      - name: Windows boot and mount policy contracts
        shell: pwsh
        run: |
          ./Tests/Portable/Test-ThunderboltBootReadiness.ps1
          ./Tests/Portable/Test-ThunderboltMountGate.ps1
          ./Tests/Portable/Test-ThunderboltEnrolledPeer.ps1
          ./Tests/Portable/Test-ThunderboltStartup.ps1
          ./Tests/Portable/Test-ThunderboltNeighborState.ps1
      # Exercises standalone sharing/rollback and native scheduler COM/CIM.
      # Windows-only: no adapter or network changes, no VIGIL dependencies.
      - name: Standalone USB4 peer and installer contracts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./Tests/Portable/Test-Usb4PeerNetwork.ps1
          ./Tests/Portable/Test-Usb4PeerNetworkInstall.ps1
          ./Tests/Portable/Test-Usb4PeerDeployment.ps1
      # Protects route/identity/custody decisions on both native backends.
      # Detects stale-edge deletion, foreign ownership mutation and CLI evidence leaks.
      # Needs standard Rust/MSVC host tools; no attached devices or privileged Apply.
      - name: Real Rust library and CLI contracts
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP 'pcai-usb4-contracts'
          cargo test --locked --manifest-path Native/pcai_core/Cargo.toml -p pcai-tb
          if ($LASTEXITCODE -ne 0) { throw 'USB4 lifecycle contracts failed' }
      - name: Strict Rust analysis
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP 'pcai-usb4-contracts'
          cargo clippy --locked --manifest-path Native/pcai_core/Cargo.toml -p pcai-tb --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'USB4 lifecycle analysis failed' }
