name: USB4 lifecycle contracts
on:
  pull_request:
    paths:
      - 'Native/pcai_core/pcai_tb_cli/**'
      - 'Native/pcai_core/Cargo.toml'
      - 'Native/pcai_core/Cargo.lock'
      # Native resolves optional train/core path dependencies from the Deploy workspace.
      - 'Deploy/Cargo.toml'
      - 'Deploy/Cargo.lock'
      - 'Deploy/**/Cargo.toml'
      - 'Config/thunderbolt-peers.json'
      - 'Config/machine-profiles/dtm-super-nuc.json'
      - 'Tools/SystemScripts/Networking/Configure-ThunderboltSwitchRoutes.ps1'
      - 'Tools/SystemScripts/Networking/Invoke-ThunderboltRcloneMount.ps1'
      - 'Tools/SystemScripts/Networking/Invoke-ThunderboltEnrolledPeer.ps1'
      - 'Tools/SystemScripts/Networking/Invoke-ThunderboltStartup.ps1'
      - 'Tools/SystemScripts/Networking/Get-Usb4FabricObservation.ps1'
      - 'Tools/SystemScripts/Networking/Invoke-VigilBoundedProcess.ps1'
      - 'Tools/SystemScripts/Networking/Invoke-Usb4PeerNetwork.ps1'
      - 'Tools/SystemScripts/Networking/Install-Usb4PeerNetwork.ps1'
      - 'Config/usb4-peer-network.example.json'
      - 'Tools/SystemScripts/Networking/Export-ThunderboltEnrolledObserver.sh'
      - 'Tests/Portable/Test-ThunderboltBootReadiness.ps1'
      - 'Tests/Portable/Test-ThunderboltMountGate.ps1'
      - 'Tests/Portable/Test-ThunderboltEnrolledPeer.ps1'
      - 'Tests/Portable/Test-ThunderboltStartup.ps1'
      - 'Tests/Portable/Test-Usb4FabricObservation.ps1'
      - 'Tests/Portable/Test-Usb4PeerNetwork.ps1'
      - 'Tests/Portable/Test-Usb4PeerNetworkInstall.ps1'
      - 'Tests/Portable/test_usb4_fabric_cli.py'
      - '.github/actions/setup-job-rust/action.yml'
      - '.github/workflows/usb4-lifecycle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lifecycle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    # Linux runs on the vigil1 runner (hosted Actions minutes are budget-blocked), except for fork
    # pull requests and a disabled runner, which keep ubuntu-latest so fork code never reaches
    # self-hosted hardware (the same gate as linux-ci.yml). Windows stays hosted for now.
    runs-on: ${{ matrix.os == 'windows-latest' && 'windows-latest' || (vars.PCAI_LINUX_RUNNER_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","Linux","X64","pc-ai-local"]') || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Set up job-local self-hosted Rust
        if: runner.environment == 'self-hosted'
        uses: ./.github/actions/setup-job-rust
        with:
          components: clippy
      - uses: dtolnay/rust-toolchain@stable
        if: runner.environment != 'self-hosted'
      # Protects the fixed read-only SSH service command; detects shell syntax
      # errors before deployment. Needs POSIX sh; source is root-owned on Linux.
      - name: Fixed observer export syntax
        if: runner.os == 'Linux'
        shell: bash
        run: sh -n Tools/SystemScripts/Networking/Export-ThunderboltEnrolledObserver.sh
      # Protects roaming host startup failure/absence and owned SFTP paths.
      # Detects masked V&V exits and default-LAN fallback without attached hardware.
      # Needs pwsh only; source: Tools/SystemScripts/Networking/*Thunderbolt*.
      - name: Windows boot and mount policy contracts
        shell: pwsh
        run: |
          ./Tests/Portable/Test-ThunderboltBootReadiness.ps1
          ./Tests/Portable/Test-ThunderboltMountGate.ps1
          ./Tests/Portable/Test-ThunderboltEnrolledPeer.ps1
          ./Tests/Portable/Test-ThunderboltStartup.ps1
          ./Tests/Portable/Test-Usb4FabricObservation.ps1
      # Protects enrolled peer policy, ownership, rollback and task installation.
      # Uses fixture operations and owned temporary files; never installs a task
      # or configures live networking. Windows-only controls identify unsupported
      # platforms explicitly. Source: Networking/*Usb4PeerNetwork.ps1.
      - name: Standalone peer controller and installer contracts
        shell: pwsh
        run: |
          ./Tests/Portable/Test-Usb4PeerNetwork.ps1
          ./Tests/Portable/Test-Usb4PeerNetworkInstall.ps1
      # Protects route/identity/custody decisions on both native backends.
      # Detects stale-edge deletion, foreign ownership mutation and CLI evidence leaks.
      # Needs standard Rust/MSVC host tools; no attached devices or privileged Apply.
      - name: Real Rust library and CLI contracts
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP 'pcai-usb4-contracts'
          cargo test --locked --manifest-path Native/pcai_core/Cargo.toml -p pcai-tb
          if ($LASTEXITCODE -ne 0) { throw 'USB4 lifecycle contracts failed' }
      # Protects the public observation-only command. Detects ignored mutation
      # options, stale edge reuse and blocking special-file input. Needs Python
      # and the binary built by the integration suite; no attached USB4 hardware.
      - name: Read-only topology CLI contracts
        shell: pwsh
        run: |
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          $binary = Join-Path $env:RUNNER_TEMP "pcai-usb4-contracts/debug/pcai-tb$suffix"
          $python = if ($IsWindows) { 'python' } else { 'python3' }
          & $python Tests/Portable/test_usb4_fabric_cli.py --exe $binary
          if ($LASTEXITCODE -ne 0) { throw 'USB4 topology CLI contracts failed' }
      # Protects target-cfg portability for ARM64 on each supported host OS.
      # This checks production and test targets without linking/running ARM64
      # binaries. Build scripts still run on the host; native SDK prerequisites
      # are not waived. The existing x64 runtime contracts remain authoritative.
      - name: Matching-OS ARM64 type checks
        shell: pwsh
        run: |
          $target = switch ($env:RUNNER_OS) {
            'Windows' { 'aarch64-pc-windows-msvc' }
            'Linux' { 'aarch64-unknown-linux-gnu' }
            default { throw 'Unsupported host for ARM64 contract checks' }
          }
          rustup target add $target
          if ($LASTEXITCODE -ne 0) { throw 'ARM64 standard-library setup failed' }
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP 'pcai-usb4-arm64-checks'
          cargo check --locked --manifest-path Native/pcai_core/Cargo.toml -p pcai-tb --all-targets --target $target
          if ($LASTEXITCODE -ne 0) { throw 'ARM64 target type checks failed' }
      - name: Strict Rust analysis
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP 'pcai-usb4-contracts'
          cargo clippy --locked --manifest-path Native/pcai_core/Cargo.toml -p pcai-tb --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'USB4 lifecycle analysis failed' }
