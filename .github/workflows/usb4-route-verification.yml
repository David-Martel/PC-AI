name: USB4 route verification
on:
  pull_request:
    branches: [main]
    paths:
      - 'Modules/PC-AI.Drivers/Public/Invoke-ThunderboltPeerLifecycle.ps1'
      - 'Tests/Portable/Test-Usb4RouteVerification.ps1'
      - 'Tests/Portable/Test-Usb4RouteOwnership.ps1'
      - '.github/workflows/usb4-route-verification.yml'
  push:
    branches: [main]
    paths:
      - 'Modules/PC-AI.Drivers/Public/Invoke-ThunderboltPeerLifecycle.ps1'
      - 'Tests/Portable/Test-Usb4RouteVerification.ps1'
      - 'Tests/Portable/Test-Usb4RouteOwnership.ps1'
      - '.github/workflows/usb4-route-verification.yml'
permissions:
  contents: read
jobs:
  route-postcondition:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    # Linux runs on the vigil1 runner (hosted Actions minutes are budget-blocked), except for fork
    # pull requests and a disabled runner, which keep ubuntu-latest so fork code never reaches
    # self-hosted hardware (the same gate as linux-ci.yml). Windows stays hosted for now.
    runs-on: ${{ matrix.os == 'windows-latest' && 'windows-latest' || (vars.PCAI_LINUX_RUNNER_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","Linux","X64","vigil1","pc-ai-local"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Verify query failures cannot certify route absence
        shell: pwsh
        run: |
          ./Tests/Portable/Test-Usb4RouteVerification.ps1
          ./Tests/Portable/Test-Usb4RouteOwnership.ps1
