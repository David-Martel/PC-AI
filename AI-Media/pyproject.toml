[project]
name = "pcai-ai-media"
version = "0.1.0"
description = "PC_AI Janus-Pro media agent (CUDA)"
# Python 3.13+ standard for this machine (managed via `uv python`).
requires-python = ">=3.13"
dependencies = [
    # RTX 5060 Ti is Blackwell (SM_120). torch 2.7.0 is the first release with SM_120 kernels;
    # SM_120 requires the CUDA 12.8 (cu128) wheels — bound below via [tool.uv.sources].
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "transformers>=4.38.2",
    "accelerate>=0.27.0",
    "sentencepiece",
    "numpy>=2.0",   # numpy 2.x is required for Python 3.13
    "pillow>=11.0",
]

# Pull torch/torchvision from the CUDA 12.8 index (NOT PyPI, which serves CPU-only wheels and would
# silently disable Blackwell support). `explicit = true` keeps everything else on PyPI.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

# Upscaling deps (basicsr/realesrgan) intentionally omitted — abandoned since 2022, CVE-2024-27763
# unpatched, no Python 3.13 wheels, and they import torchvision.transforms.functional_tensor which
# was removed in torchvision >=0.17. ImageUpscaler in main.py already falls back to BICUBIC on ImportError.
