[workspace]
resolver = "2"
members = [
    "pcai_core_lib",
    "pcai_perf_cli",
    "pcai_ollama_rs",
    "pcai_inference",
    "pcai_media_model",
    "pcai_media",
    "pcai_media_server",
]

[workspace.package]
version = "0.1.0"
authors = ["David Martel"]
edition = "2021"
# Verified floor, not aspiration: `cargo +1.85 check -p pcai-inference
# --no-default-features --features server,ffi` passes clean. 1.85 is also the
# floor Cargo.lock v4 (>=1.78) and `[workspace.lints]` (>=1.74) already imply,
# and it matches the fleet-wide clippy MSRV. The maintenance workflow reads
# this key rather than hard-coding a version, so the gate cannot drift again.
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/David-Martel/PC-AI"

[workspace.dependencies]
# FFI and C interop
libc = "0.2"

# Parallel processing
rayon = "1.10"

# High-performance file walking (ripgrep's engine)
ignore = "0.4"

# SHA-256 hashing
sha2 = "0.10"

# Glob pattern matching
globset = "0.4"

# Regular expressions
regex = "1.11"

# JSON serialization
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.149"

# Windows API bindings
windows-sys = "0.61"

# UTF-16 strings for Windows APIs
widestring = "1.1"

# System information (cross-platform)
sysinfo = "0.38"

# Directory walking
walkdir = "2.5"

# Concurrency primitives
parking_lot = "0.12"

# Windows Registry access
winreg = "0.56"

# Utility dependencies
path-slash = "0.2"
dunce = "1.0"
anyhow = "1.0.102"
thiserror = "2.0"
tokio = { version = "1.50", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
base64 = "0.23"
hex = "0.4"
memmap2 = "0.9.10"
num_cpus = "1.16"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async helpers
async-trait = "0.1"
futures = "0.3"

# IDs
uuid = { version = "1.23", features = ["v4"] }

# HTTP server
axum = "0.8"
tower-http = { version = "0.6", features = ["trace", "cors"] }

# LLM backends
llm = { git = "https://github.com/rustformers/llama-rs.git", rev = "b11ffb14fde039f068c808df8dcbd1257a01b8db", default-features = false, features = ["models"] }
mistralrs = "0.7"
mistralrs-core = "0.7"
rand = "0.10.2"
ollama-rs = { version = "0.3.4", features = ["stream"] }
schemars = "1.2.2"
url = "2.5"

[profile.release]
opt-level = 3      # Maximum optimization
lto = "thin"       # Thin LTO: 2-5% runtime speedup, moderate compile cost
codegen-units = 16 # Parallelize for faster build
strip = false      # Keep symbols for verification
panic = "abort"    # Smaller binary, faster panics

[workspace.lints.rust]
# Enforced: verified clean at -D warnings on 2026-09-07.
ambiguous_negative_literals = "warn"
redundant_lifetimes = "warn"
unsafe_op_in_unsafe_fn = "allow"   # 25 sites (edition-2024 E0133)
unused_lifetimes = "warn"
# Deferred backlog -- see TODO.md 1b. Measured counts, not guesses.
missing_debug_implementations = "allow"  # 32 sites
redundant_imports = "allow"              # 18 sites
trivial_numeric_casts = "allow"          # 2 sites

[workspace.lints.clippy]
# Enforced groups: verified clean at -D warnings on 2026-09-07.
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
# Deferred groups -- see TODO.md 1b.
cargo = { level = "allow", priority = -1 }     # 25 sites (publish metadata; crates are unpublished)
pedantic = { level = "allow", priority = -1 }  # ~800 sites
# Deferred individual lints, with measured counts.
allow_attributes_without_reason = "allow"  # 6 sites
clone_on_ref_ptr = "allow"                 # 21 sites
empty_drop = "warn"
map_err_ignore = "allow"                   # 17 sites
undocumented_unsafe_blocks = "allow"       # 59 sites
unused_result_ok = "allow"                 # 1 site

[patch.crates-io]
#candle-kernels = { path = "vendor/candle-kernels-0.9.2" }

[patch."https://github.com/rustformers/llama-rs.git"]
ggml-sys = { path = "third_party/ggml-sys" }
