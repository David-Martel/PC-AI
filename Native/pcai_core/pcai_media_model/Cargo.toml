[package]
name = "pcai-media-model"
version = "0.1.0"
edition = "2021"
description = "Janus-Pro model architecture for PC_AI media agent"
license = "MIT"
rust-version.workspace = true

[dependencies]
anyhow = "1.0"
candle-core = { version = "0.11" }
candle-nn = "0.11"
candle-transformers = "0.11"
candle-flash-attn = { version = "0.11", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = []
# Enable CUDA acceleration.  Requires CUDA Toolkit (nvcc) at build time.
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
# Enable cuDNN v9 for conv1d/conv2d ops.
#
# The `cudnn` feature enables Candle's optional cuDNN backend.  Janus-Pro
# attention uses its separate matmul/Flash Attention paths; any cuDNN
# performance benefit must be measured on the selected workload and device.
cudnn = ["cuda", "candle-core/cudnn"]
flash-attn = ["dep:candle-flash-attn"]

[lints]
workspace = true
