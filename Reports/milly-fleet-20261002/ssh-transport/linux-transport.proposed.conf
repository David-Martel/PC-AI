# PROPOSAL ONLY. Linux clients; insert before earlier matching scalar directives.
# Create ~/.ssh/cm with mode 0700, owned by the invoking user, before enablement.
# Render only aliases actually owned/pinned on the client; never ship to Windows ssh.exe.
Host millylaptop1 asuspro13 spark-0060 spark-3066
    ControlMaster auto
    ControlPath ~/.ssh/cm/vigil-%n-%C
    ControlPersist 120s
    Compression no
    ServerAliveInterval 30
    ServerAliveCountMax 3
    ConnectTimeout 8
    ConnectionAttempts 1
# Keep current HostName/User/IdentityFile/HostKeyAlias/known_hosts/ProxyJump entries.
# Root/other owner/bulk channels require their own control directory/profile.