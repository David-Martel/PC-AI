# Windows-native fleet transport settings. Four exact aliases; no route/key change.
# Loaded before management/Spark includes so first-obtained scalar values apply.
# Native Win32 OpenSSH does not support ControlMaster/ControlPath session sharing.
Host millylaptop1 asuspro13 spark-0060 spark-3066
    ConnectTimeout 10
    ConnectionAttempts 1
    ServerAliveInterval 30
    ServerAliveCountMax 3
    Compression no
    ForwardAgent no
