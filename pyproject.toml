# Preserve the commit gate's existing E/F selection for authored Python.
[tool.ruff.lint]
select = ["E", "F"]

# These three byte-authenticated upstream fixture generators intentionally import
# NumPy after creating a PyTorch fixture and retain their published long lines.
# Preserve their source hashes; all other lint rules and authored files stay checked.
[tool.ruff.lint.per-file-ignores]
"vendor/candle-core-0.9.2/tests/pth.py" = ["E402", "E501"]
"vendor/candle-core-0.10.2/tests/pth.py" = ["E402", "E501"]
"vendor/candle-core-0.11.0/tests/pth.py" = ["E402", "E501"]
