id: flag-hardcoded-endpoints-rs
language: rust
message: "Hardcoded IP addresses and loopback hosts are not permitted. Use llm-config.json for dynamic lookup."
severity: error
ignores:
  - '**/tests/**'
  - '**/examples/**'
  - '**/target/**'
  - 'Deploy/rust-functiongemma-*/**'
  - 'Native/pcai_core/pcai_core_lib/src/path.rs'
rule:
  kind: string_literal
  regex: '(https?://(?:127\.0\.0\.1|localhost|0\.0\.0\.0)(?::\d+)?|(?:127\.0\.0\.1|localhost|0\.0\.0\.0):\d+)'
  # The '**/tests/**' exemption above is unreachable for a binary crate: an
  # integration test cannot call a private fn, so a unit test for URL parsing
  # has to live in an inline `mod tests`. Literal endpoints are the fixture
  # there, not a hardcoded default, so exempt that module the same way.
  # Production code in the same file is still checked.
  not:
    inside:
      kind: mod_item
      stopBy: end
      has:
        field: name
        regex: '^tests$'
